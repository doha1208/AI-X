services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.db
      ROUTE_ARTIFACT_DIR: /artifacts
      ROUTE_BUILDER_AUTO_START: "false"
      ROUTE_ENVIRONMENT_SOURCES_PATH: /data/route_sources/environment_sources.json
      ROUTE_SOURCE_CATALOG_PATH: /app/data/route_source_catalog.json
    volumes:
      - ./backend/data/production:/data
      - ./backend/data/production/route_artifacts:/artifacts
      - ./backend/data/osm:/app/data/osm:ro
      - ./backend/data/route_source_catalog.json:/app/data/route_source_catalog.json:ro
      - ./backend/data/route_validation_cases.json:/app/data/route_validation_cases.json:ro

  artifact-builder:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["python", "-m", "scripts.artifact_builder_worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.db
      ROUTE_ARTIFACT_DIR: /artifacts
      ROUTE_BUILDER_AUTO_START: "false"
      ROUTE_ENVIRONMENT_SOURCES_PATH: /data/route_sources/environment_sources.json
      ROUTE_SOURCE_CATALOG_PATH: /app/data/route_source_catalog.json
    volumes:
      - ./backend/data/production:/data
      - ./backend/data/production/route_artifacts:/artifacts
      - ./backend/data/osm:/app/data/osm:ro
      - ./backend/data/route_source_catalog.json:/app/data/route_source_catalog.json:ro
      - ./backend/data/route_validation_cases.json:/app/data/route_validation_cases.json:ro
